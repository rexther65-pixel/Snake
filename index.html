
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gusto Mo Ba Ako?</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #ffe4ec;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    .container {
        text-align: center;
        background: white;
        padding: 40px 25px;
        border-radius: 25px;
        width: 300px;
        box-shadow: 0 5px 25px #e9a3b8;
    }

    h1 {
        color: #ff4d88;
    }

    p {
        color: #777;
    }

    button {
        border: none;
        padding: 12px 30px;
        border-radius: 25px;
        font-size: 18px;
        cursor: pointer;
        margin: 10px;
    }

    #yes {
        background: #ff4d88;
        color: white;
    }

    #no {
        background: #aaa;
        color: white;
        position: absolute;
    }

    #message {
        display: none;
        color: #ff3380;
        font-size: 28px;
        margin-top: 20px;
        font-weight: bold;
    }
</style>
</head>
<body>

<div class="container">
    <h1>Gusto Mo Ba Ako? 💗</h1>
    <p>Please choose honestly! 🥺</p>

    <button id="yes" onclick="love()">YES 💕</button>
    <button id="no">NO 😝</button>

    <div id="message">
        I LOVE YOU! ❤️🥰
        <p>MWUAHHH! 💋</p>
    </div>
</div>

<script>
    const no = document.getElementById("no");

    function moveNo() {
        const maxX = window.innerWidth - no.offsetWidth;
        const maxY = window.innerHeight - no.offsetHeight;

        no.style.left = Math.random() * maxX + "px";
        no.style.top = Math.random() * maxY + "px";
    }

    no.addEventListener("mouseover", moveNo);
    no.addEventListener("touchstart", function(e) {
        e.preventDefault();
        moveNo();
    });

    function love() {
        document.getElementById("message").style.display = "block";
        document.getElementById("yes").style.display = "none";
        no.style.display = "none";
    }
</script>

</body>
</html>
